
name: Build MYRIX APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract MYRIX ZIP
        shell: bash
        run: |
          ZIP=$(find . -type f -iname '*.zip' \
            -not -path './.git/*' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP MYRIX tidak ditemukan"
            exit 1
          fi

          echo "Mengekstrak: $ZIP"
          mkdir -p extracted
          unzip -oq "$ZIP" -d extracted

          echo "Isi hasil ekstrak:"
          find extracted -maxdepth 4 -type f | head -100

      - name: Find Android project
        id: project
        shell: bash
        run: |
          ROOT=""

          while IFS= read -r file; do
            DIR="$(dirname "$file")"
            if { [ -f "$DIR/settings.gradle" ] || \
                 [ -f "$DIR/settings.gradle.kts" ]; } && \
               { [ -f "$DIR/app/build.gradle" ] || \
                 [ -f "$DIR/app/build.gradle.kts" ]; }; then
              ROOT="$DIR"
              break
            fi
          done < <(find extracted -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \))

          if [ -z "$ROOT" ]; then
            echo "Proyek Android tidak ditemukan dalam ZIP"
            exit 1
          fi

          echo "project_dir=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Proyek: $ROOT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        shell: bash
        run: |
          cd "${{ steps.project.outputs.project_dir }}"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MYRIX-debug-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
