
name: Build MYRIX APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build MYRIX APK
        shell: bash
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -f "app/gradlew" ]; then
            cd app
            chmod +x gradlew
            ./gradlew assembleDebug
          elif [ -f "app/build.gradle" ] || [ -f "app/build.gradle.kts" ]; then
            gradle assembleDebug
          elif [ -f "MYRIX_Android/gradlew" ]; then
            cd MYRIX_Android
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "File Gradle proyek tidak ditemukan."
            echo "Periksa lokasi build.gradle dan gradlew."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MYRIX-debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
